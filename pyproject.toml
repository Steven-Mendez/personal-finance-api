[project]
name = "personal-finance-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asgi-correlation-id>=4.3.4",
    "boto3>=1.34.0",
    "fastapi[standard]>=0.135.1",
    "pydantic-settings>=2.7.1",
    "python-jose[cryptography]>=3.3.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that exercise app wiring and external boundaries",
    "e2e: tests that exercise HTTP-to-response behavior with in-process clients",
    "asyncio: tests that run async code",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "venv/", ".venv/"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
