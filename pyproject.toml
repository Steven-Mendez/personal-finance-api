[project]
name = "personal-finance-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "pydantic-settings>=2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that exercise app wiring and external boundaries",
    "e2e: tests that run against a deployed/running service",
]
