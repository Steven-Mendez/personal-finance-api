[project]
name = "personal-finance-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asgi-correlation-id>=4.3.4",
    "asyncpg>=0.31.0",
    "boto3>=1.34.0",
    "botocore[crt]>=1.42.68",
    "fastapi[standard]>=0.135.1",
    "greenlet>=3.3.2",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic-settings>=2.7.1",
    "python-jose[cryptography]>=3.3.0",
    "slowapi>=0.1.9",
    "sqlalchemy>=2.0.48",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "psycopg[binary]>=3.3.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.0.0",
    "pytest-postgresql>=8.0.0",
    "pytest-socket>=0.7.0",
    "ruff>=0.15.6",
    "sqlalchemy[mypy]>=2.0.48",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that exercise app wiring and external boundaries",
    "e2e: tests that exercise HTTP-to-response behavior with in-process clients",
    "asyncio: tests that run async code",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/main.py",
    "app/core/config.py",
    "app/core/logging_config.py",
    "app/**/__init__.py"
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/", "venv/", ".venv/"]
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
