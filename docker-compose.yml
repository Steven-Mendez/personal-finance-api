services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Mount local code for live reloading during development
    volumes:
      - ./app:/app/app
    healthcheck:
      # python:slim has no curl/wget, so we use the stdlib urllib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
