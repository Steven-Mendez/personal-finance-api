name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: make sync

    - name: Lint with ruff
      run: make ruff

    - name: Type check with mypy
      run: make mypy

    - name: Run database migration check
      run: make db-migrate
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance

    - name: Run tests
      run: make test-all
      env:
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance
        COGNITO_USER_POOL_ID: us-east-1_example
        COGNITO_APP_CLIENT_ID: example_client_id
